[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hyrange"
version = "1.0.0"
description = "hyperedge certification from pair counts and node degrees (HyRange)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "scipy>=1.13"]

[tool.setuptools]
packages = ["hyrange"]

[tool.pytest.ini_options]
testpaths = ["tests"]
